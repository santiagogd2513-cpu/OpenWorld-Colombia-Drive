name: Android Build (Godot 4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "OpenWorldColombiaDrive"

jobs:
  validate:
    name: Validar proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar archivos esenciales
        run: |
          echo "Verificando estructura Godot..."
          test -f project.godot && echo "✓ project.godot encontrado" || (echo "✗ Falta project.godot" && exit 1)
          test -f .gitignore && echo "✓ .gitignore encontrado"
          test -d docs/fases && echo "✓ Documentación de fases OK"
          echo ""
          echo "Contenido de project.godot (primeras líneas):"
          head -n 30 project.godot
          echo ""
          echo "Validación básica completada."

      - name: Resumen
        run: |
          echo "### Validación del proyecto :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- project.godot presente" >> $GITHUB_STEP_SUMMARY
          echo "- Estructura de documentación OK" >> $GITHUB_STEP_SUMMARY
          echo "- Motor: **Godot 4**" >> $GITHUB_STEP_SUMMARY

  build-android:
    name: Exportar APK (Godot 4)
    needs: validate
    runs-on: ubuntu-latest
    # Generar APK en workflow_dispatch o en push a main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (para Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot + Export Templates
        run: |
          GODOT_VERSION=${{ env.GODOT_VERSION }}
          echo "Descargando Godot ${GODOT_VERSION}..."

          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          else
            cp -r /tmp/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi

          echo "Godot y templates listos."
          ./godot --version

      - name: Preparar estructura mínima y preset de exportación
        run: |
          mkdir -p build/android scenes scripts

          # Escena principal mínima si no existe
          if [ ! -f scenes/main.tscn ]; then
            cat > scenes/main.tscn << 'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node3D"]
          EOF
          fi

          # Preset de exportación Android (debug)
          cat > export_presets.cfg << 'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/OpenWorldColombiaDrive.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1.0"
          package/unique_name="org.colombia.drive.openworld"
          package/name="OpenWorld Colombia Drive"
          package/signed=true
          screen/immersive_mode=true
          permissions/access_network_state=true
          permissions/internet=true
          EOF

          echo "Estructura mínima y preset listos."

      - name: Exportar APK
        id: export
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Exportando en modo: $BUILD_TYPE"

          ./godot --headless --path . --export-${BUILD_TYPE} "Android" build/android/${{ env.EXPORT_NAME }}.apk || {
            echo "El export falló (normal al principio si faltan recursos o el keystore). Se sube lo disponible para inspección."
          }

          echo "Contenido de build/:"
          find build -type f || true

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld-Colombia-Drive-Android-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Resumen
        run: |
          echo "### Build Android (Godot 4)" >> $GITHUB_STEP_SUMMARY
          echo "- Motor: **Godot ${{ env.GODOT_VERSION }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Tipo: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact disponible en la pestaña Actions (si se generó APK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nota: Mientras el proyecto no tenga escenas y assets reales, el APK será un placeholder mínimo." >> $GITHUB_STEP_SUMMARY
