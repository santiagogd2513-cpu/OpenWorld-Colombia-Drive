name: Android Build (Godot 4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "OpenWorldColombiaDrive"

jobs:
  validate:
    name: Validar proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar archivos esenciales
        run: |
          echo "Verificando estructura Godot..."
          test -f project.godot && echo "✓ project.godot encontrado" || (echo "✗ Falta project.godot" && exit 1)
          test -f icon.svg && echo "✓ icon.svg encontrado" || echo "⚠ Sin icono"
          test -f export_presets.cfg && echo "✓ export_presets.cfg encontrado" || echo "⚠ Sin export_presets"
          test -f scenes/main.tscn && echo "✓ escena principal encontrada" || echo "⚠ Sin main.tscn"
          test -d docs/fases && echo "✓ Documentación de fases OK"
          echo ""
          echo "Validación básica completada."

      - name: Resumen
        run: |
          echo "### Validación del proyecto :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- project.godot presente" >> $GITHUB_STEP_SUMMARY
          echo "- Icono y export presets revisados" >> $GITHUB_STEP_SUMMARY
          echo "- Motor: **Godot 4**" >> $GITHUB_STEP_SUMMARY
          echo "- App: **OpenWorld Colombia Drive** (categoría juego, modo inmersivo)" >> $GITHUB_STEP_SUMMARY

  build-android:
    name: Exportar APK (Godot 4)
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot + Export Templates
        run: |
          GODOT_VERSION=${{ env.GODOT_VERSION }}
          echo "Descargando Godot ${GODOT_VERSION}..."

          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          else
            cp -r /tmp/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi

          echo "Godot y templates listos."
          ./godot --version

      - name: Preparar build
        run: |
          mkdir -p build/android

          # Usar el export_presets.cfg del repositorio (ya tiene immersive + categoría juego + icono)
          if [ ! -f export_presets.cfg ]; then
            echo "No hay export_presets.cfg, creando uno de respaldo..."
            cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_path="build/android/OpenWorldColombiaDrive.apk"
          [preset.0.options]
          package/unique_name="org.colombia.drive.openworld"
          package/name="OpenWorld Colombia Drive"
          package/app_category=2
          screen/immersive_mode=true
          version/name="0.1.0-beta1"
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          EOF
          fi

          echo "Usando export_presets.cfg del proyecto."
          echo "--- Contenido relevante ---"
          grep -E "package/name|immersive|app_category|version/name|unique_name" export_presets.cfg || true

      - name: Exportar APK
        id: export
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Exportando OpenWorld Colombia Drive en modo: $BUILD_TYPE"

          ./godot --headless --path . --export-${BUILD_TYPE} "Android" build/android/${{ env.EXPORT_NAME }}.apk 2>&1 | tee export.log || {
            echo "Export terminó con código distinto de cero. Revisando si se generó APK..."
          }

          echo ""
          echo "=== Contenido de build/ ==="
          find build -type f -ls || true
          echo ""
          echo "=== Últimas líneas del log ==="
          tail -n 40 export.log || true

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld-Colombia-Drive-v0.1.0-beta1-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: warn
          retention-days: 21

      - name: Resumen
        run: |
          echo "### Build Android — OpenWorld Colombia Drive" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Nombre:** OpenWorld Colombia Drive" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** Godot ${{ env.GODOT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tipo:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo inmersivo:** Sí (barras de navegación ocultas)" >> $GITHUB_STEP_SUMMARY
          echo "- **Categoría Android:** Juego" >> $GITHUB_STEP_SUMMARY
          echo "- **Icono:** icon.svg" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descarga el Artifact desde la pestaña **Actions** de este workflow." >> $GITHUB_STEP_SUMMARY
