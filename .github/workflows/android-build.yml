name: Android Build (Unreal Engine 5)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Development'
        type: choice
        options:
          - Development
          - Shipping
      generate_apk:
        description: 'Intentar generar APK (requiere runner con UE5)'
        required: true
        default: 'false'
        type: boolean

# Nota importante:
# Un build completo de Unreal Engine 5 para Android NO es viable en los runners
# gratuitos de GitHub (falta de espacio en disco, tiempo y necesidad de tener
# el motor instalado). Este workflow está diseñado para:
# 1. Siempre validar la estructura del proyecto
# 2. Ejecutar el empaquetado real SOLO en self-hosted runners que tengan
#    Unreal Engine 5 + Android SDK/NDK ya instalados.
#
# Para usar el build real:
# - Configura un self-hosted runner (Windows o Linux) con UE5 instalado
# - Añade el label "ue5-android" al runner
# - Opcionalmente define el secret UE5_ENGINE_PATH si la ruta no es estándar

jobs:
  validate-project:
    name: Validar estructura del proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar archivos esenciales
        run: |
          echo "Verificando estructura del proyecto..."
          test -f OpenWorldColombiaDrive.uproject && echo "✓ .uproject encontrado" || (echo "✗ Falta el .uproject" && exit 1)
          test -f .gitignore && echo "✓ .gitignore encontrado"
          test -d docs/fases && echo "✓ Documentación de fases encontrada"
          echo ""
          echo "Contenido del .uproject:"
          cat OpenWorldColombiaDrive.uproject
          echo ""
          echo "Validación básica completada correctamente."

      - name: Resumen
        run: |
          echo "### Validación del proyecto :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- Archivo .uproject presente" >> $GITHUB_STEP_SUMMARY
          echo "- Estructura de documentación OK" >> $GITHUB_STEP_SUMMARY
          echo "- Listo para builds en self-hosted runners" >> $GITHUB_STEP_SUMMARY

  # Job de empaquetado real (solo corre en runners con label ue5-android)
  build-android:
    name: Empaquetar APK (UE5)
    needs: validate-project
    # Solo se ejecuta si se pide explícitamente o en self-hosted
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.generate_apk == 'true'
    runs-on: [self-hosted, ue5-android]
    timeout-minutes: 180

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar variables de entorno
        id: setup
        shell: bash
        run: |
          # Ruta del motor (se puede sobreescribir con secret UE5_ENGINE_PATH)
          if [ -n "${{ secrets.UE5_ENGINE_PATH }}" ]; then
            ENGINE_PATH="${{ secrets.UE5_ENGINE_PATH }}"
          else
            # Rutas comunes — ajusta según tu instalación
            if [ -d "/opt/UnrealEngine" ]; then
              ENGINE_PATH="/opt/UnrealEngine"
            elif [ -d "C:/Program Files/Epic Games/UE_5.5" ]; then
              ENGINE_PATH="C:/Program Files/Epic Games/UE_5.5"
            else
              echo "No se encontró Unreal Engine. Define el secret UE5_ENGINE_PATH."
              exit 1
            fi
          fi

          echo "ENGINE_PATH=$ENGINE_PATH" >> $GITHUB_ENV
          echo "PROJECT_PATH=$GITHUB_WORKSPACE/OpenWorldColombiaDrive.uproject" >> $GITHUB_ENV
          echo "BUILD_CONFIG=${{ inputs.build_configuration || 'Development' }}" >> $GITHUB_ENV
          echo "ARCHIVE_DIR=$GITHUB_WORKSPACE/Saved/StagedBuilds/Android" >> $GITHUB_ENV

          echo "Motor: $ENGINE_PATH"
          echo "Proyecto: $GITHUB_WORKSPACE/OpenWorldColombiaDrive.uproject"

      - name: Verificar que el motor existe
        run: |
          if [ ! -d "$ENGINE_PATH" ]; then
            echo "Error: No existe el directorio del motor en $ENGINE_PATH"
            exit 1
          fi
          echo "Motor encontrado correctamente."

      - name: Generar archivos de proyecto (si es necesario)
        run: |
          # En muchos setups self-hosted esto ya está hecho, pero por si acaso
          echo "Omitiendo generación automática de project files (asumimos entorno preparado)."

      - name: Empaquetar para Android (RunUAT)
        id: package
        shell: bash
        run: |
          UAT="$ENGINE_PATH/Engine/Build/BatchFiles/RunUAT.sh"
          if [ ! -f "$UAT" ]; then
            UAT="$ENGINE_PATH/Engine/Build/BatchFiles/RunUAT.bat"
          fi

          echo "Usando UAT: $UAT"
          echo "Configuración: $BUILD_CONFIG"

          # Comando de empaquetado
          # Nota: ajusta -platform, -clientconfig, etc. según tu setup exacto
          "$UAT" BuildCookRun \
            -project="$PROJECT_PATH" \
            -noP4 \
            -platform=Android \
            -clientconfig="$BUILD_CONFIG" \
            -cook \
            -allmaps \
            -build \
            -stage \
            -pak \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/Saved/StagedBuilds" \
            -package \
            -utf8output \
            || {
              echo "El empaquetado falló. Revisa los logs."
              exit 1
            }

      - name: Buscar APK generada
        id: find-apk
        run: |
          echo "Buscando archivos APK..."
          find "$GITHUB_WORKSPACE/Saved" -name "*.apk" -o -name "*.aab" | tee apk_list.txt

          APK_COUNT=$(wc -l < apk_list.txt)
          echo "APKs/AABs encontrados: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No se generó ninguna APK. El job fallará."
            exit 1
          fi

          # Tomar la primera APK encontrada para el artifact
          FIRST_APK=$(head -n 1 apk_list.txt)
          echo "APK_PATH=$FIRST_APK" >> $GITHUB_ENV
          echo "apk_path=$FIRST_APK" >> $GITHUB_OUTPUT

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld-Colombia-Drive-Android-${{ inputs.build_configuration || 'Development' }}
          path: |
            ${{ env.APK_PATH }}
            **/Saved/StagedBuilds/**/*.apk
            **/Saved/StagedBuilds/**/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Resumen del build
        run: |
          echo "### Build Android completado :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Configuración: ${{ inputs.build_configuration || 'Development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- APK generada y subida como artifact" >> $GITHUB_STEP_SUMMARY
          echo "- Descarga el artifact desde la pestaña Actions de este workflow" >> $GITHUB_STEP_SUMMARY

  # Job informativo cuando no se puede hacer build real
  build-info:
    name: Información sobre builds
    needs: validate-project
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.generate_apk != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mensaje informativo
        run: |
          echo "### Cómo generar la APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Este repositorio tiene configurado un pipeline de build para Unreal Engine 5 + Android." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Para generar una APK real necesitas:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Un **self-hosted runner** con Unreal Engine 5 instalado" >> $GITHUB_STEP_SUMMARY
          echo "2. Etiquetar el runner con: \`self-hosted\` y \`ue5-android\`" >> $GITHUB_STEP_SUMMARY
          echo "3. (Opcional) Secret \`UE5_ENGINE_PATH\` apuntando a la carpeta del motor" >> $GITHUB_STEP_SUMMARY
          echo "4. Ejecutar este workflow manualmente (workflow_dispatch) y marcar **generate_apk = true**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mientras tanto, el job de validación se ejecuta en cada push para asegurar que la estructura del proyecto está correcta." >> $GITHUB_STEP_SUMMARY
